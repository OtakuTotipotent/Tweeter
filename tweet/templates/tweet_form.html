{% extends "layout.html" %}
{% block title %}Create & Update{% endblock title %}
{% block content %}
    <h1 class="text-center mt-4">
        {% if form.instance.pk %}
            Edit Your Tweet Carefully
        {% else %}
            Create a Tweet of Yours
        {% endif %}
    </h1>
    <form method="post" enctype="multipart/form-date" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Submit</button>
    </form>
    <a href="{% url 'tweet_list' %}">Cancel and Back to Tweets</a>
{% endblock content %}
