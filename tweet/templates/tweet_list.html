{% extends "layout.html" %}
{% block title %}Tweets{% endblock title %}
{% block content %}
  <h1 class="text-center mt-4">Tweets from Tweeters</h1>
  <a class="btn btn-primary mb-4 mt-4" href="{% url 'tweet_create' %}">Create a Tweet</a>
  <div class="container row gap-3">
    {% for tweet in tweets %}
      <div class="card w-25">
        {% if tweet.photo %}
        <img src="{{ tweet.photo.url }}"
             class="card-img-top"
             alt="Tweeters Imagine"
             width="100%"
             height="">
             {% else %}
             <div class="card-img-top"></div>
             {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ tweet.user.username }}</h5>
          <p class="card-text">{{ tweet.text }}.</p>
          <a href="{% url 'tweet_edit' tweet.id %}" class="btn btn-secondary">Edit</a>
          <a href="{% url 'tweet_delete' tweet.id %}" class="btn btn-danger">Delete</a>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock content %}
