{% extends "layout.html" %}
{% block title %}Logged Out{% endblock title %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm text-center">
            <div class="card-body p-4">
                <h1 class="h3">You have been logged out</h1>
                <p class="mb-4">Your Tweeter session has ended.</p>
                <a class="btn btn-primary" href="{% url 'login' %}">Login Again</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
